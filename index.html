<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OFPPT — Chatbot Inscriptions</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet"/>

<style>
  :root {
    --green: #00a86b;
    --green-dark: #007a4d;
    --green-light: #e6f7f1;
    --red: #c0392b;
    --red-light: #fdf0ee;
    --bg: #f4f6f8;
    --white: #ffffff;
    --gray: #6b7280;
    --gray-light: #e5e7eb;
    --text: #1a1a2e;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  header {
    width: 100%;
    background: linear-gradient(135deg, #007a4d 0%, #00c17a 100%);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 12px rgba(0,120,70,0.25);
  }

  .logo-circle {
    width: 52px; height: 52px;
    background: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: var(--green-dark);
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .header-text h1 {
    color: white; font-size: 1.05rem; font-weight: 700;
  }

  .header-text p {
    color: rgba(255,255,255,0.82); font-size: 0.75rem;
  }

  .lang-bar {
    width: 100%; max-width: 700px;
    display: flex; gap: 8px;
    padding: 14px 16px 0;
  }

  .lang-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 2px solid var(--green);
    background: white;
    cursor: pointer;
  }

  .chat-wrap {
    width: 100%; max-width: 700px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 14px 16px 0;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 62vh;
  }

  .bubble {
    max-width: 88%;
    padding: 13px 17px;
    border-radius: 18px;
  }

  .bubble.bot {
    background: white;
    align-self: flex-start;
  }

  .bubble.user {
    background: var(--green);
    color: white;
    align-self: flex-end;
  }

  .input-bar {
    width: 100%;
    max-width: 700px;
    display: flex;
    gap: 10px;
    padding: 12px 16px 20px;
  }

  .input-bar input {
    flex: 1;
    padding: 12px 18px;
    border-radius: 30px;
    border: 2px solid var(--gray-light);
  }

  .input-bar button {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--green);
    border: none;
    cursor: pointer;
  }

  .back-card{
    margin-top:14px;
    padding:12px 18px;
    border-radius:16px;
    background:white;
    border:2px solid var(--green);
    cursor:pointer;
  }

  /* ✅ AJOUT IMPORTANT : SIGNATURE */
  .signature {
    position: fixed;
    bottom: 10px;
    left: 10px;
    font-size: 12px;
    color: #666;
    font-family: Arial, sans-serif;
    opacity: 0.8;
    z-index: 9999;
  }

</style>
</head>

<body>

<header>
  <div class="logo-circle">🎓</div>
  <div class="header-text">
    <h1>Institut Spécialisé de Technologie Appliquée</h1>
    <p>Chatbot Inscriptions OFPPT</p>
  </div>
</header>

<div class="chat-wrap">
  <div class="messages" id="messages"></div>
</div>

<div class="input-bar">
  <input type="text" id="userInput" placeholder="Posez votre question..."/>
  <button onclick="sendMessage()"></button>
</div>

<!-- ✅ SIGNATURE AJOUTÉE ICI -->
<div class="signature">
  Abdellah MESLOUHI — Droits réservés © 2026
</div>

<script>
function addBubble(text, type='bot') {
  const div = document.createElement('div');
  div.className = 'bubble ' + type;
  div.innerHTML = text;
  document.getElementById('messages').appendChild(div);
}

function sendMessage() {
  const input = document.getElementById('userInput');
  if (!input.value.trim()) return;

  addBubble(input.value, 'user');
  input.value = '';

  setTimeout(() => {
    addBubble("Réponse du chatbot...");
  }, 800);
}
</script>

</body>
</html>
